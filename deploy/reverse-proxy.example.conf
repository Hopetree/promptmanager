# promptmanager 公网反向代理样例（nginx）
#
# 用途：公网形态 = 反代终结 HTTPS，再把请求转发给本机 8767 的 promptmanager（服务本身不做 TLS）。
# ⚠️ 这是**占位符模板**：所有 <...> 都要在部署时替换成真实值；不要把真实域名/证书路径提交进仓库。
# ⚠️ 实际改动 nginx/证书/防火墙由 host_manger 在用户授权后执行；本项目只交付样例。
#
# 配套的服务端环境变量（见 deploy/promptmanager.env.example）：
#   TRUST_PROXY=1                      # 确有反代时才开：来源 IP 取 X-Forwarded-For
#   PUBLIC_ORIGIN=https://<PUBLIC_HOSTNAME>   # 设置后会话 cookie 追加 Secure
#   CORS_ORIGINS=https://<PUBLIC_HOSTNAME>    # 若浏览器从别的 origin 直连 API，才需要

server {
    listen      80;
    server_name <PUBLIC_HOSTNAME>;
    # 公网一律转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen              443 ssl;
    http2               on;
    server_name         <PUBLIC_HOSTNAME>;

    # 证书占位符（部署时替换为真机路径，例如 certbot 生成的目录）
    ssl_certificate     <CERT_DIR>/fullchain.pem;
    ssl_certificate_key <CERT_DIR>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 导入整库备份时请求体可能较大（服务端单请求上限 32MB）
    client_max_body_size 64m;

    location / {
        proxy_pass         http://127.0.0.1:8767;
        proxy_http_version 1.1;

        # 必须转发：服务端靠这两个头判断真实来源与协议（TRUST_PROXY=1 时才生效）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
