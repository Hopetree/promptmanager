name: ci

# 代码质量检查（BRIEF AC-77 ③ / 阶段 26 A）。
# ⚠️ 本 workflow **只做 `npm ci` + 调 `tools/ci-check.sh`** —— 本地跑的是**同一个脚本**，
#    保证"CI 一套、本地另一套"不会发生（见 README「代码质量检查」一节）。
# ⚠️ 不需要任何 secrets；不部署、不发布、不 push 任何东西。

on:
  push:
    branches: ['**']
  pull_request:

# 同一 ref 的重复触发只留最新一次，省掉并行重复跑。
# ⚠️ 但 **main 上不取消**（2026-10-09 修）：`main` 的每次 push 都是**已发布/待发布**的提交，
#    取消它会让"发布提交的 ci"显示成 `cancelled` —— 看起来像 CI 没过，实际是被后来的提交取代。
#    （实证：v1.7.0 指向的 57f5beb 的 ci 就是被随后的 9e91a6a 取消的。）
#    ⇒ 取消只用于 **PR / 特性分支**（那里"最新一次代表当前状态"成立）；main 上的 run 一律跑完。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: 质量检查（类型 / 测试 / 构建 / 体积预算）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 与生产一致的 Node 大版本（BRIEF §5：Node 24）
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖（npm ci）
        run: npm ci

      # 依赖漏洞扫描：**只报告不阻断**（首次上线不设门禁 —— 否则上游冒出一个新 CVE
      # 就会把所有无关的 PR 一起卡住）。要收紧成门禁时，去掉末尾的 `|| true` 即可。
      # ⚠️ 必须显式指定官方 registry：默认的 npmmirror **不实现 audit 端点**（会报 NOT_IMPLEMENTED）。
      - name: 依赖漏洞扫描（report-only）
        run: npm audit --omit=dev --registry=https://registry.npmjs.org || true

      # 类型检查 → 全量测试 → 构建 → 体积预算（最大 chunk ≤ 500KB）
      - name: 代码质量检查（与本地同一套脚本）
        run: bash tools/ci-check.sh
